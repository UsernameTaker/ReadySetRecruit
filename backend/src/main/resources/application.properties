# ---------- Server ----------
server.port=${PORT:8080}
server.shutdown=graceful
spring.application.name=readysetrecruit
# Local dev: load secrets like TBA_API_KEY from backend/.env (gitignored). Real env vars still win.
spring.config.import=optional:file:.env[.properties]

# ---------- Database ----------
# Local dev: an H2 file database under ./data (no install needed).
# Production: set DATABASE_URL=jdbc:postgresql://<host>/<db>?sslmode=require plus DB_USER / DB_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/readysetrecruit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- App ----------
# MUST be overridden in production with a random string of 32+ characters.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.ttl-hours=${JWT_TTL_HOURS:168}
# Comma separated list of frontend origins allowed by CORS.
app.cors.origins=${FRONTEND_ORIGIN:http://localhost:5173}
# Users who register with one of these emails become admins.
app.admin-emails=${ADMIN_EMAILS:}
# Shared secret used by the GitHub Actions cron job to trigger the scraper.
app.cron-token=${CRON_TOKEN:}
# Loads a handful of demo teams on first start (handy locally; turn off in prod).
app.seed-demo=${SEED_DEMO:true}

# ---------- Scraper / importers ----------
app.scraper.user-agent=${SCRAPER_USER_AGENT:ReadySetRecruitBot/0.1 (+https://github.com/your-org/readysetrecruit)}
app.scraper.batch-size=${SCRAPER_BATCH_SIZE:100}
app.scraper.recheck-days=${SCRAPER_RECHECK_DAYS:14}
app.scraper.delay-ms=${SCRAPER_DELAY_MS:1000}
# Websites checked at the same time (each one is a different site, so this doesn't hammer anybody).
app.scraper.threads=${SCRAPER_THREADS:10}
# While the server is awake, check another batch of websites every N minutes.
app.scraper.auto=${SCRAPER_AUTO:true}
# Check a team's website when they save their profile, and refuse ones that don't open.
app.scraper.verify-on-save=${SCRAPER_VERIFY_ON_SAVE:true}
app.scraper.interval-minutes=${SCRAPER_INTERVAL_MINUTES:5}
# Optional: lets the scraper look for websites of teams that don't list one.
app.search.brave-api-key=${BRAVE_API_KEY:}
# Team importers. FTC teams come from FTCScout (no key needed); FRC teams need a free TBA key.
# On first start the server imports them automatically (turn off with AUTO_IMPORT=false).
app.import.auto=${AUTO_IMPORT:true}
app.import.tba-api-key=${TBA_API_KEY:}
app.import.ftc-username=${FTC_API_USERNAME:}
app.import.ftc-token=${FTC_API_TOKEN:}
# Optional: VEX V5 / VEX IQ teams from RobotEvents (free key: events.vex.com/api/v2 -> Request Access (formerly robotevents.com))
app.import.robotevents-api-key=${ROBOTEVENTS_API_KEY:}
